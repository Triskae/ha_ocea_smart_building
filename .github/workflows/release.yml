name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"Invalid release tag: {tag}")

          version = tag.removeprefix("v")
          integration_path = Path("custom_components/ocea_smart_building")
          manifest = json.loads(
              (integration_path / "manifest.json").read_text(encoding="utf-8")
          )

          spec = importlib.util.spec_from_file_location(
              "ocea_smart_building_const",
              integration_path / "const.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Unable to load integration constants")
          constants = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(constants)

          expected_user_agent = f"Home-Assistant-Ocea-Smart-Building/{version}"
          if manifest["version"] != version:
              raise SystemExit(
                  f'Tag version {version} does not match manifest version '
                  f'{manifest["version"]}'
              )
          if constants.INTEGRATION_VERSION != version:
              raise SystemExit(
                  f"Tag version {version} does not match User-Agent version "
                  f"{constants.INTEGRATION_VERSION}"
              )
          if expected_user_agent not in constants.UA:
              raise SystemExit("User-Agent does not contain the release version")
          PY

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi

          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
            fi
          } > "$notes_file"

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ocea Smart Building $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --latest
