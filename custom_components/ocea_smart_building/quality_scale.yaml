rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register service actions.
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: todo
  dependency-transparency:
    status: exempt
    comment: The integration has no third-party runtime requirements; requests is only used by the standalone CLI.
  docs-actions:
    status: exempt
    comment: The integration does not provide service actions.
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities use coordinator updates and do not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: todo
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide service actions.
  config-entry-unloading: todo
  docs-configuration-parameters:
    status: exempt
    comment: The integration does not provide an options flow.
  docs-installation-parameters: done
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The cloud service does not provide network discovery information.
  discovery:
    status: exempt
    comment: The integration is configured with a resident account and has no discoverable network devices.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration uses resident-account data rather than targeting specific devices.
  docs-supported-functions: done
  docs-troubleshooting: todo
  dynamic-devices: todo
  entity-category:
    status: exempt
    comment: All entities expose primary consumption measurements.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration's entities are primary consumption measurements and are not noisy.
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency:
    status: exempt
    comment: The integration has no third-party runtime dependency; its HTTP client uses Home Assistant's aiohttp support.
  inject-websession: done
  strict-typing: todo
